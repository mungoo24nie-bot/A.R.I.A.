plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.aria.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.aria.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }

    signingConfigs {
        release {
            def signingKeyPath = System.getenv('ARIA_KEYSTORE_PATH')
            def signingPassword = System.getenv('ARIA_SIGNING_PASSWORD')
            if (signingKeyPath && signingPassword) {
                storeFile file(signingKeyPath)
                storePassword signingPassword
                keyAlias 'aria'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
