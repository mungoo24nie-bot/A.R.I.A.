plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.aria.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.aria.app'
        minSdk 26
        targetSdk 35
        versionCode 37
        versionName '2.1.9'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            def signingKeyPath = System.getenv('ARIA_KEYSTORE_PATH')
            def signingPassword = System.getenv('ARIA_SIGNING_PASSWORD')
            if (signingKeyPath && signingPassword) {
                storeFile file(signingKeyPath)
                storePassword signingPassword
                keyAlias 'aria'
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Lokalny odczyt warstwy tekstowej plików PDF (bez OCR).
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
