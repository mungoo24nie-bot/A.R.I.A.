name: Build ARIA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Integrate ARIA 1.9
        run: python3 aria19_integrate.py
      - name: Fetch pinned llama.cpp source
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
      - name: Restore private signing key
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
          ARIA_SIGNING_PASSWORD: ${{ secrets.ARIA_SIGNING_PASSWORD }}
        run: |
          test -n "$ARIA_KEYSTORE_BASE64" || { echo 'Missing ARIA_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$ARIA_SIGNING_PASSWORD" || { echo 'Missing ARIA_SIGNING_PASSWORD secret'; exit 1; }
          printf '%s' "$ARIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aria-release.jks"
          echo "ARIA_KEYSTORE_PATH=$RUNNER_TEMP/aria-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK with llama.cpp
        env:
          ARIA_SIGNING_PASSWORD: ${{ secrets.ARIA_SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-1.9-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
